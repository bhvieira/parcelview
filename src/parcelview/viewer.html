<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* Playback controls on top; the cortex, playing one series (or every series, in rows or a grid), beside (or
   above) the chosen parcel's series. */
:root {
  --bg: #f4f5f2; --panel: #ffffff; --ink: #1a1d1f; --ink-2: #4f5458; --muted: #868b8f; --rule: #dfe1dc;
  --accent: #2a78d6; --neg: #2a78d6; --mid: #ecebe6; --pos: #e34948; --wall: #b9bab4; --nodata: #8e908a;
  --seq-lo: #e6e3f6; --seq-mid: #8b80dd; --seq-hi: #2f2575;
  --hue-lo: #b3aaeb; --hue-mid: #8b80dd; --hue-hi: #2f2575;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --panel: #191d20; --ink: #eceeee; --ink-2: #b4b9bc; --muted: #7f868b; --rule: #2a3034;
    --accent: #5b9df0; --neg: #3987e5; --mid: #33383c; --pos: #e66767; --wall: #24282b; --nodata: #4b5054;
    --seq-lo: #2b2842; --seq-mid: #6a5fc4; --seq-hi: #cac3f7;
    --hue-lo: #4d459b; --hue-mid: #8b80dd; --hue-hi: #cac3f7;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --panel: #191d20; --ink: #eceeee; --ink-2: #b4b9bc; --muted: #7f868b; --rule: #2a3034;
  --accent: #5b9df0; --neg: #3987e5; --mid: #33383c; --pos: #e66767; --wall: #24282b; --nodata: #4b5054;
  --seq-lo: #2b2842; --seq-mid: #6a5fc4; --seq-hi: #cac3f7;
  --hue-lo: #4d459b; --hue-mid: #8b80dd; --hue-hi: #cac3f7;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
.app { max-width: 1320px; margin: 0 auto; padding: 20px 20px 32px; display: grid; gap: 16px; }
header { display: grid; gap: 4px; }
h1 { font-size: 1.55rem; font-weight: 650; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.sub { color: var(--ink-2); margin: 0; max-width: 75ch; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.group.grow { flex: 1 1 260px; flex-wrap: nowrap; }
.lab { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 2px; white-space: nowrap; }
button, select {
  font: 500 .85rem var(--font); color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; max-width: 100%;
}
button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, canvas:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
#play { min-width: 5.2em; }
.seg { display: inline-flex; flex-wrap: wrap; }
.seg button { border-radius: 0; margin-left: -1px; padding-inline: 8px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
#time { flex: 1; min-width: 120px; accent-color: var(--ink); }
.clock { font-size: .82rem; color: var(--ink-2); white-space: nowrap; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 1000px) {
  .stage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .stage.rows, .stage.grid { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  .stage.grid > :last-child { position: sticky; top: 16px; }  /* the plot stays in view while the grid scrolls */
}
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0; }
.phead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.phead h2 { margin-right: auto; }
.hint { font-size: .82rem; color: var(--ink-2); margin: 0; max-width: 90ch; }
.err { color: var(--pos); }
.brainwrap { position: relative; width: 100%; height: 300px; }
#brain { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }
.views { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; pointer-events: none; }
.views span { font-size: .72rem; color: var(--muted); padding: 4px 6px; letter-spacing: .04em; }
.views span.row { grid-column: 1 / -1; padding: 2px 6px; line-height: 16px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.views span.row + span.row { border-top: 1px solid var(--rule); }
.views span.cell { padding: 2px 4px; line-height: 16px; color: var(--ink-2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.views span.focus { outline: 2px solid var(--ink-2); outline-offset: -2px; border-radius: 4px; }
.views .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.huekey { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: .8rem; color: var(--ink-2); }
.huekey .bar { flex: 0 1 160px; min-width: 60px; background: linear-gradient(90deg, var(--hue-lo), var(--hue-mid), var(--hue-hi)); }
.viewnames { display: grid; grid-template-columns: repeat(4, 1fr); font-size: .72rem; color: var(--muted); letter-spacing: .04em; }
.viewnames span { padding-inline: 6px; }
.scale { display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; gap: 4px 10px; align-items: center; font-size: .8rem; color: var(--ink-2); }
.bar { height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--neg), var(--mid), var(--pos)); }
.bar.seq { background: linear-gradient(90deg, var(--seq-lo), var(--seq-mid), var(--seq-hi)); }
.scale .unit { grid-column: 1 / -1; color: var(--muted); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggle { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }
.toggle[aria-pressed="true"] { background: var(--panel); color: var(--ink); border-color: var(--ink-2); }
.toggle[aria-pressed="false"] { color: var(--muted); }
.toggle .key { width: 14px; height: 2px; border-radius: 1px; flex: none; }
.toggle[aria-pressed="false"] .key { opacity: .3; }
#series { width: 100%; height: 260px; display: block; cursor: crosshair; touch-action: pan-y; }
@media (max-width: 560px) { .app { padding-inline: 16px; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1 id="title"></h1>
    <p class="sub" id="description" hidden></p>
  </header>

  <div class="controls" role="toolbar" aria-label="Playback">
    <div class="group"><button id="play" aria-pressed="false">Play</button><button id="loop" aria-pressed="true">Loop</button></div>
    <div class="group"><span class="lab" id="speedLab">Speed</span><span class="seg" id="speed" role="group" aria-labelledby="speedLab"></span></div>
    <div class="group"><label class="lab" for="interp">Interpolation</label><select id="interp">
      <option value="lanczos">Lanczos (smooth)</option><option value="linear">Linear</option><option value="nearest">Nearest sample</option></select></div>
    <div class="group grow"><label class="lab" for="time">Time</label><input type="range" id="time" min="0" max="1" step="any" value="0"><span class="mono clock" id="clock" aria-live="off"></span></div>
  </div>

  <div class="stage" id="stage">
    <section class="panel" aria-label="Cortex">
      <div class="phead" id="showRow"><label class="lab" for="show">Cortex shows</label><select id="show"></select></div>
      <div class="phead" id="viewRow" hidden><span class="lab" id="viewLab">View</span><span class="seg" id="viewPick" role="group" aria-labelledby="viewLab"></span></div>
      <div class="viewnames" id="viewnames" hidden><span>Left lateral</span><span>Right lateral</span><span>Left medial</span><span>Right medial</span></div>
      <div class="brainwrap" id="brainwrap">
        <canvas id="brain" aria-label="Cortical surface in four views: left and right lateral, then left and right medial. Click a parcel to plot its series."></canvas>
        <div class="views" id="views"><span>Left lateral</span><span>Right lateral</span><span>Left medial</span><span>Right medial</span></div>
      </div>
      <div class="scale"><span class="mono" id="lo"></span><div class="bar" id="bar"></div><span class="mono" id="hi"></span><span class="unit" id="unit"></span></div>
      <p class="hint mono" id="hover"></p>
      <p class="hint err" id="brainNote" hidden></p>
    </section>

    <section class="panel" aria-label="Series of the chosen parcel">
      <div class="phead"><h2 id="seriesTitle"></h2>
        <span class="group"><label class="lab" for="parcel">Parcel</label><select id="parcel"></select></span></div>
      <div class="phead" id="plotRow"><span class="lab" id="plotLab">Plot</span><span class="toggles" id="plot" role="group" aria-labelledby="plotLab"></span></div>
      <div class="huekey" id="huekey" hidden><span class="lab" id="hueLab"></span><span class="mono" id="hueLo"></span><div class="bar"></div><span class="mono" id="hueHi"></span></div>
      <canvas id="series" aria-label="Series of the chosen parcel"></canvas>
      <p class="hint mono" id="readout"></p>
    </section>
  </div>
  <p class="hint">Space plays or pauses. The arrow keys step one sample, or ten with Shift.</p>
  <p class="hint err" id="errors" hidden></p>
</main>
<script type="application/json" id="pv-data">__DATA__</script>
<script>
"use strict";
window.addEventListener('error', ev => {
  const el = document.getElementById('errors');
  el.hidden = false; el.textContent = `Something went wrong: ${ev.message}`;
});
const D = JSON.parse(document.getElementById('pv-data').textContent);
const $ = id => document.getElementById(id);
const TYPES = { float32: Float32Array, int16: Int16Array, int32: Int32Array, uint16: Uint16Array, uint32: Uint32Array };
function decode(s, T) {
  const bin = atob(s), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new T(u8.buffer);
}

// ---------- data ----------
const R = D.parcels.names.length, LABELS = D.parcels.labels, GROUPS = D.parcels.groups, DRAWN = D.parcels.drawn;
const SIG = D.signals.map((s, i) => ({ ...s, data: decode(s.data, Float32Array), color: `--c${i + 1}`, index: i, hue: D.hue ? D.hue.values[i] : null }));
const VALS = SIG.map(() => new Float32Array(R));  // every series at the current time, all parcels
// Whether the cortex draws every series rather than the one chosen: in rows of four views, or a grid of one view each
const ALL = D.cortex !== 'one', ROWS = D.cortex === 'rows', GRID = D.cortex === 'grid';
const OVERLAY = D.plots === 'overlay';  // the chosen parcel's series on one axis, rather than a row each
const VIEWS = [{ hemi: 0, side: -1, name: 'Left lateral' }, { hemi: 1, side: 1, name: 'Right lateral' },
               { hemi: 0, side: 1, name: 'Left medial' }, { hemi: 1, side: -1, name: 'Right medial' }];
// Series drawn together that share one colour range share one scale; otherwise each range goes beside its name
const SHARED = SIG.every(s => s.cmap === SIG[0].cmap && s.unit === SIG[0].unit && s.limits[0] === SIG[0].limits[0] && s.limits[1] === SIG[0].limits[1]);
const T0 = Math.min(...SIG.map(s => s.start)), T1 = Math.max(...SIG.map(s => s.start + (s.n - 1) * s.tr));
const DUR = T1 - T0, STEP = Math.min(...SIG.map(s => s.tr));
const WINDOW = Math.min(D.window, Math.max(DUR, STEP));

// ---------- theme ----------
let tokens = {};
const token = name => tokens[name] ??= getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function rgb(hex) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
}
const MINUS = '−';
function fmt(v, digits = 3) {
  if (!Number.isFinite(v)) return 'no data';
  const a = Math.abs(v);
  return (a !== 0 && (a >= 1e5 || a < 1e-3) ? v.toExponential(digits - 1) : v.toPrecision(digits)).replace('-', MINUS);
}
const fmtAxis = (v, span) => v.toFixed(Math.max(0, Math.min(6, 2 - Math.floor(Math.log10(Math.max(span, 1e-12)))))).replace('-', MINUS);
const withUnit = (v, unit) => fmt(v) + (unit && Number.isFinite(v) ? ` ${unit}` : '');
// Line colours: by hue on a light-to-dark scale when given; otherwise a colour per series, or one for all in an overlay
const HUE = D.hue && { label: D.hue.label, lo: Math.min(...D.hue.values), hi: Math.max(...D.hue.values) };
function hueColor(v) {  // through three stops, linear in sRGB like the legend's gradient
  const u = HUE.hi > HUE.lo ? (v - HUE.lo) / (HUE.hi - HUE.lo) : .5, [a, m, b] = ['--hue-lo', '--hue-mid', '--hue-hi'].map(n => rgb(token(n)));
  const [p, q, f] = u < .5 ? [a, m, u * 2] : [m, b, u * 2 - 1];
  return `rgb(${p.map((x, k) => Math.round(255 * (x + (q[k] - x) * f))).join(' ')})`;
}
const lineColor = s => HUE ? hueColor(s.hue) : OVERLAY ? token('--ink-2') : token(s.color);

// ---------- state ----------
const params = new URLSearchParams(location.hash.slice(1));
const state = {
  t: T0, playing: !matchMedia('(prefers-reduced-motion: reduce)').matches && DUR > 0, speed: D.speed, loop: D.loop,
  interp: D.interpolation, show: 0, view: 0, parcel: D.selected, plotted: new Set(D.plot), hover: null, seriesHover: null,
  near: null, dirty: true,
};
if (params.has('t')) state.t = Math.min(T1, Math.max(T0, T0 + (+params.get('t') || 0)));
if (params.has('paused')) state.playing = false;
if (params.has('show') && SIG[+params.get('show')]) state.show = +params.get('show');
if (params.has('view') && VIEWS[+params.get('view')]) state.view = +params.get('view');
if (params.has('parcel') && +params.get('parcel') >= 0 && +params.get('parcel') < R) state.parcel = +params.get('parcel');
if (['lanczos', 'linear', 'nearest'].includes(params.get('interp'))) state.interp = params.get('interp');

// ---------- sampling: a series' value at any time, under the chosen interpolation ----------
function lanczos(u) {  // Lanczos-3 kernel: a windowed sinc, close to band-limited interpolation
  if (Math.abs(u) < 1e-9) return 1;
  if (Math.abs(u) >= 3) return 0;
  const a = Math.PI * u;
  return 3 * Math.sin(a) * Math.sin(a / 3) / (a * a);
}
const KW = new Float64Array(6), KO = new Int32Array(6);
function kernel(s, t) {  // offsets (sample * R) and weights for time t; returns how many, 0 outside the samples
  const u = (t - s.start) / s.tr, n = s.n, clamp = k => Math.min(n - 1, Math.max(0, k));
  if (!(u > -1e-6 && u < n - 1 + 1e-6)) return 0;
  if (state.interp === 'nearest' || n === 1) { KO[0] = clamp(Math.round(u)) * R; KW[0] = 1; return 1; }
  if (state.interp === 'linear') {
    const k = Math.min(n - 2, Math.max(0, Math.floor(u))), f = Math.min(1, Math.max(0, u - k));
    KO[0] = k * R; KW[0] = 1 - f; KO[1] = (k + 1) * R; KW[1] = f;
    return 2;
  }
  // Lanczos-3 through the six nearest samples, the edge samples repeated beyond the ends
  const k0 = Math.floor(u);
  for (let j = 0; j < 6; j++) { const k = k0 - 2 + j; KW[j] = lanczos(u - k); KO[j] = clamp(k) * R; }
  return 6;
}
function apply(s, m, r) {  // missing samples are left out and the weights renormalised
  let v = 0, w = 0;
  for (let j = 0; j < m; j++) {
    const wj = KW[j];
    if (wj === 0) continue;
    const x = s.data[KO[j] + r];
    if (x === x) { v += wj * x; w += wj; }
  }
  return Math.abs(w) > 1e-3 ? v / w : NaN;
}
function valueAt(s, r, t) { const m = kernel(s, t); return m ? apply(s, m, r) : NaN; }
function sampleAll(s, t, out) {
  const m = kernel(s, t);
  if (!m) { out.fill(NaN); return; }
  for (let r = 0; r < R; r++) out[r] = apply(s, m, r);
}
const sampleTime = (s, k) => s.start + k * s.tr;
function visible(s, t0, t1) {  // samples in [t0, t1], with one before so lines enter from the edge
  return [Math.max(0, Math.ceil((t0 - s.start) / s.tr - 1e-9) - 1), Math.min(s.n - 1, Math.floor((t1 - s.start) / s.tr + 1e-9))];
}

// ---------- controls ----------
$('title').textContent = D.title;
document.title = D.title;
if (D.description) { $('description').textContent = D.description; $('description').hidden = false; }

function setPlaying(on) {
  if (on && state.t >= T1 - 1e-9) state.t = T0;  // play from the start once at the end
  state.playing = on && DUR > 0;
  $('play').textContent = state.playing ? 'Pause' : 'Play';
  $('play').setAttribute('aria-pressed', String(state.playing));
  state.dirty = true;
}
$('play').addEventListener('click', () => setPlaying(!state.playing));
$('play').disabled = !(DUR > 0);
$('loop').setAttribute('aria-pressed', String(state.loop));
$('loop').addEventListener('click', () => { state.loop = !state.loop; $('loop').setAttribute('aria-pressed', String(state.loop)); });

const SPEEDS = [...new Set([0.25, 0.5, 1, 2, 4, 8, 16, D.speed])].sort((a, b) => a - b);
SPEEDS.forEach(v => {
  const b = document.createElement('button');
  b.textContent = `${v}×`; b.dataset.v = v; b.setAttribute('aria-pressed', String(v === state.speed));
  b.addEventListener('click', () => {
    state.speed = v;
    $('speed').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.v === v)));
  });
  $('speed').appendChild(b);
});

$('interp').value = state.interp;
$('interp').addEventListener('change', ev => { state.interp = ev.target.value; state.dirty = true; });

SIG.forEach(s => { const o = document.createElement('option'); o.value = s.index; o.textContent = s.name; $('show').appendChild(o); });
$('show').value = state.show;
$('show').addEventListener('change', ev => { state.show = +ev.target.value; updateScale(); state.dirty = true; });
const SWATCHES = [];  // [element, series]: keys coloured as the series' line
if (ALL) {  // each series' name over its row or cell, keyed by its line's colour; in rows, view names once above the columns
  $('stage').classList.add(D.cortex); $('showRow').hidden = true; $('viewnames').hidden = !ROWS; $('viewRow').hidden = !GRID;
  $('views').replaceChildren(...SIG.map(s => {
    const el = document.createElement('span');
    el.className = ROWS ? 'row' : 'cell';
    if (HUE || !OVERLAY) { const sw = document.createElement('span'); sw.className = 'swatch'; el.append(sw); SWATCHES.push([sw, s]); }
    el.append(SHARED ? s.name : `${s.name} · ${fmt(s.limits[0])} to ${withUnit(s.limits[1], s.unit)}`);
    return el;
  }));
  $('brain').setAttribute('aria-label', ROWS
    ? 'Cortical surface, one row per series, each in four views: left and right lateral, then left and right medial. Click a parcel to plot its series.'
    : 'Cortical surface, one view of every series, in a grid. Click a parcel to plot its series.');
}
if (GRID) VIEWS.forEach((v, i) => {  // which view the grid draws
  const b = document.createElement('button');
  b.textContent = v.name; b.setAttribute('aria-pressed', String(i === state.view));
  b.addEventListener('click', () => {
    state.view = i; state.hover = null; state.dirty = true;
    $('viewPick').querySelectorAll('button').forEach((x, k) => x.setAttribute('aria-pressed', String(k === i)));
  });
  $('viewPick').appendChild(b);
});

const slider = $('time');
slider.min = T0; slider.max = T1; slider.step = 'any'; slider.disabled = !(DUR > 0);
let resume = false;
slider.addEventListener('pointerdown', () => { resume = state.playing; if (resume) setPlaying(false); });
slider.addEventListener('input', () => { state.t = +slider.value; state.dirty = true; });
slider.addEventListener('change', () => { if (resume) { resume = false; setPlaying(true); } });
const fmtClock = t => `${(t - T0).toFixed(1)} s`;

function selectParcel(r) {
  state.parcel = r; $('parcel').value = r; state.dirty = true;
  $('seriesTitle').textContent = LABELS[r] + (GROUPS && GROUPS[r] ? ` · ${GROUPS[r]}` : '');
}
{
  // The menu: by group when there are groups, parcels that are not on the surface last
  const sections = new Map();
  for (let r = 0; r < R; r++) {
    const key = !DRAWN[r] ? '\u0000off' : GROUPS ? GROUPS[r] : '';
    if (!sections.has(key)) sections.set(key, []);
    sections.get(key).push(r);
  }
  const keys = [...sections.keys()].filter(k => k !== '\u0000off');
  if (sections.has('\u0000off')) keys.push('\u0000off');

const hoverTime = (g, t0) => state.seriesHover === null ? null : t0 + (state.seriesHover.x - g.left) / g.plotW * WINDOW;
// The series picked out: the one hovered on the cortex, or in an overlay the line nearest the pointer
const focused = () => ALL && state.hover ? cellSignal(state.hover.cell) : state.near;
function drawSeries() { if (OVERLAY) drawOverlay(); else drawRows(); }
function drawRows() {
  const rows = SIG.filter(s => state.plotted.has(s.index)), g = seriesGeometry(rows.length);
  const t1 = state.t, t0 = t1 - WINDOW, r = state.parcel, tx = t => g.left + (t - t0) / WINDOW * g.plotW;
  sctx.fillStyle = token('--panel'); sctx.fillRect(0, 0, g.w, g.h);

function drawOverlay() {

  sctx.fillStyle = token('--panel'); sctx.fillRect(0, 0, g.w, g.h);
  const curves = SIG.map(s => curve(s, r, t0, t1, g.plotW)), [lo, hi] = yRange(curves), unit = SIG[0].unit;
  const yt = g.top, y0 = yt + g.title, y1 = y0 + g.rowH, ty = v => y1 - (v - lo) / (hi - lo) * g.rowH;

    let best = Infinity;

  const f = focused();

    sctx.strokeStyle = token('--panel'); sctx.lineWidth = 5; stroke(curves[f], tx, ty);

  else $('readout').textContent = `${tq === null ? 'now' : `${fmt(tq - t1, 3)} s`} · ${SIG[f].name}: ${withUnit(valueAt(SIG[f], r, tq ?? t1), SIG[f].unit)}`;

let marked = null;
