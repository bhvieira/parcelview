[project]
name = "parcelview"
version = "0.1.0"
description = "Play parcel time series on the cortex, for any parcellation, as one self-contained interactive HTML page"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Bruno Hebling Vieira", email = "bruno.hebling.vieira@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["neuroimaging", "fmri", "bold", "parcellation", "cortex", "visualization", "webgl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "nibabel>=5.0",
    "nilearn>=0.12",
    "numpy>=1.24",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]
